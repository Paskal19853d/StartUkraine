<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТМ "ЗОРЯНА ПАМ'ЯТЬ"</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;font-family:'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
h1{font-size:28px;font-weight:700;color:#111;margin-bottom:12px}
p{font-size:15px;color:#555;margin-bottom:6px}
.sub{font-size:13px;color:#999;margin-bottom:32px}
.bar-wrap{width:220px;height:3px;background:#eee;border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;width:0%;background:#111;border-radius:3px;animation:load var(--dur,3s) linear forwards}
@keyframes load{to{width:100%}}
.timer{font-size:13px;color:#aaa}
.brand{margin-top:40px;font-size:11px;letter-spacing:2px;color:#ccc;text-transform:uppercase}
</style>
</head>
<body>
<h1>502 Bad Gateway</h1>
<p>RESTART SERVER — please wait</p>
<div class="sub" id="s">3 seconds…</div>
<div class="bar-wrap"><div class="bar" id="bar"></div></div>
<div class="timer" id="t"></div>
<div class="brand">ТМ "ЗОРЯНА ПАМ'ЯТЬ"</div>
<script>
var sec=3,el=document.getElementById('s'),bar=document.getElementById('bar');
bar.style.setProperty('--dur',sec+'s');
var iv=setInterval(function(){
  sec--;
  if(sec<=0){clearInterval(iv);el.textContent='Connecting…';location.reload();}
  else el.textContent=sec+' second'+(sec>1?'s':'')+'…';
},1000);
</script>
</body>
</html>
