<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Технічні роботи — Зоряна Пам'ять</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.star-icon{width:72px;height:72px;background:#fff;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:sp 2s ease-in-out infinite;margin-bottom:32px;filter:drop-shadow(0 0 24px rgba(255,255,255,.5))}
@keyframes sp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.code{font-size:clamp(64px,12vw,120px);font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff;margin-bottom:8px}
.title{font-size:clamp(18px,3vw,26px);font-weight:700;color:#fff;margin-bottom:10px}
.sub{font-size:clamp(13px,2vw,15px);color:rgba(255,255,255,.4);max-width:400px;line-height:1.6;margin-bottom:40px}
.divider{width:48px;height:1px;background:rgba(255,255,255,.12);margin:0 auto 36px}
.progress-wrap{width:min(300px,80vw);margin-bottom:12px}
.progress-label{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.progress-bar{height:2px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:#fff;border-radius:1px;transition:width .1s linear}
.timer{font-size:13px;color:rgba(255,255,255,.28);letter-spacing:.03em}
.timer span{color:rgba(255,255,255,.65);font-weight:600;font-variant-numeric:tabular-nums}
.btn-reload{margin-top:36px;padding:12px 30px;border-radius:30px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:.02em;transition:background .2s,border-color .2s;backdrop-filter:blur(8px)}
.btn-reload:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.footer-brand{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.18);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wrap">
  <div class="star-icon"></div>
  <div class="code">502</div>
  <div class="title">Технічні роботи</div>
  <div class="sub">Сервер перезапускається.<br>Зачекайте — сторінка оновиться автоматично.</div>
  <div class="divider"></div>
  <div class="progress-wrap">
    <div class="progress-label">Автооновлення</div>
    <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
  </div>
  <div class="timer">через <span id="sec">15</span> с</div>
  <button class="btn-reload" onclick="location.reload()">&#8635;&nbsp; Оновити зараз</button>
</div>
<div class="footer-brand">Зоряна Пам'ять</div>
<script>
var total=15,left=total;
var pf=document.getElementById('pf'),sec=document.getElementById('sec');
setInterval(function(){
  left--;if(left<0){location.reload();return;}
  sec.textContent=left;pf.style.width=((total-left)/total*100)+'%';
},1000);
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stars=[];
function resize(){
  cv.width=innerWidth;cv.height=innerHeight;stars=[];
  for(var i=0,n=Math.floor(cv.width*cv.height/3500);i<n;i++)
    stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.1+.2,a:Math.random(),da:(Math.random()*.007+.002)*(Math.random()<.5?1:-1),vy:Math.random()*.05+.008});
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(function(s){
    s.a+=s.da;if(s.a>=1){s.a=1;s.da*=-1;}else if(s.a<=0){s.a=0;s.da*=-1;}
    s.y-=s.vy;if(s.y<-4){s.y=cv.height+4;s.x=Math.random()*cv.width;}
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+s.a.toFixed(2)+')';ctx.fill();
  });
  requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
