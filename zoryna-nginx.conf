# ── Nginx Reverse Proxy для Зоряна Пам'ять ──
# Встановлення: sudo apt install nginx
# Копіювання: sudo cp zoryna-nginx.conf /etc/nginx/sites-available/zoryna
# Активація: sudo ln -s /etc/nginx/sites-available/zoryna /etc/nginx/sites-enabled/
# Перевірка: sudo nginx -t && sudo systemctl reload nginx

upstream zoryna_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # ← Замініть на свій домен

    # ── SSL (розкоментувати після налаштування Let's Encrypt) ──
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # ── Стиснення ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Безпека ──
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Блокування чутливих файлів ──
    location ~* \.(db|sqlite|sqlite3|sql\.gz|env|bak|log|key|pem|cfg|ini|conf|sh|bat|py|md|txt|toml|lock|yaml|yml)$ {
        deny all;
        return 404;
    }

    # ── Блокування прихованих файлів (.git, .env тощо) ──
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Блокування прямого доступу до внутрішніх директорій ──
    location ~ ^/(logs|venv|__pycache__|\.git|Doc)/ {
        deny all;
        return 404;
    }

    # ── Статичні файли ──
    root /var/www/zoryna;
    index index.html;

    location / {
        try_files $uri $uri/ @backend;
    }

    # ── Кешування статичних ассетів ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── WebSocket (окремий location — обов'язково!) ──
    location /ws/ {
        proxy_pass http://zoryna_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── API ──
    location @backend {
        proxy_pass http://zoryna_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ── Сторінки помилок ──
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 503 504 /500.html;
    # 502 — окремо: бекенд недоступний (перезапуск), завжди віддається з диска
    error_page 502 /500.html;

    location = /404.html { root /var/www/zoryna; internal; }
    location = /403.html { root /var/www/zoryna; internal; }
    location = /500.html {
        root /var/www/zoryna;
        internal;
        # Не кешувати — щоб браузер одразу побачив відновлення
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Обмеження розміру завантаження ──
    client_max_body_size 10M;
}
